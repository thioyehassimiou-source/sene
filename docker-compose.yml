version: '3.8'

services:
  # ============================================================================
  # POSTGRESQL DATABASE
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: sene-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sene_db}
      POSTGRES_USER: ${POSTGRES_USER:-sene_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sene_secure_password_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sene_admin} -d ${POSTGRES_DB:-sene_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sene-network

  # ============================================================================
  # REDIS (BullMQ & Cache)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: sene-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-sene_redis_secret}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-sene_redis_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sene-network

  # ============================================================================
  # MINIO OBJECT STORAGE (S3-Compatible)
  # ============================================================================
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: sene-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sene_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sene_minio_password_2026}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sene-network

  # ============================================================================
  # MINIO BUCKET INITIALIZER (One-shot)
  # ============================================================================
  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: sene-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set sene_minio http://minio:9000 ${MINIO_ROOT_USER:-sene_minio_admin} ${MINIO_ROOT_PASSWORD:-sene_minio_password_2026};
      /usr/bin/mc mb sene_minio/sene-producers --ignore-existing;
      /usr/bin/mc mb sene_minio/sene-crops --ignore-existing;
      /usr/bin/mc mb sene_minio/sene-deliveries --ignore-existing;
      /usr/bin/mc anonymous set download sene_minio/sene-crops;
      exit 0;
      "
    networks:
      - sene-network

  # ============================================================================
  # BACKEND API (NestJS Modular Monolith)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: sene-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-4000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-sene_admin}:${POSTGRES_PASSWORD:-sene_secure_password_2026}@postgres:5432/${POSTGRES_DB:-sene_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-sene_redis_secret}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-sene_minio_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-sene_minio_password_2026}
      JWT_SECRET: ${JWT_SECRET:-sene_dev_jwt_secret_change_in_production_min32chars}
      JWT_EXPIRATION: 86400s
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-sene_dev_refresh_secret_change_in_production}
      JWT_REFRESH_EXPIRATION: 604800s
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      RATE_LIMIT_TTL: 60
      RATE_LIMIT_LIMIT: 120
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - sene-network

  # ============================================================================
  # FRONTEND (Next.js Back-office Admin)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: sene-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - sene-network

# ==============================================================================
# NETWORKS & VOLUMES
# ==============================================================================
networks:
  sene-network:
    driver: bridge
    name: sene-network

volumes:
  pgdata:
    name: sene_postgres_data
  redisdata:
    name: sene_redis_data
  miniodata:
    name: sene_minio_data
